[package]
name = "chime-vst"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
vf-core = { path = "../vf-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
crossbeam-queue = "0.3"
anyhow = "1"
# Compile out trace/debug logging everywhere: Cranelift logs every instruction it emits.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
